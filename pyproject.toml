[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "odds_scanner"
dynamic = ["version"]
description = "Escáner de cuotas deportivas basado en The Odds API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "hypothesis>=6.100",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-openpyxl>=3.1",
    "respx>=0.21",
]

[project.scripts]
odds-scanner = "odds_scanner.cli:app"

[tool.hatch.version]
path = "src/odds_scanner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odds_scanner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Una conexión o archivo sin cerrar (ResourceWarning) hace fallar la suite.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning", "error::ResourceWarning"]

[tool.coverage.run]
source = ["odds_scanner"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
