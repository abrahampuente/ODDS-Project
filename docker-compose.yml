# Uso:
#   docker compose build
#   docker compose run --rm scanner doctor
#   docker compose run --rm scanner            # corrida completa: quota -> scan --yes -> rank -> export
#   docker compose --profile scheduler up -d   # escaneo programado 10:00 y 18:00 (hora de Chile)
# La key se lee de .env en el host (env_file) y nunca entra a la imagen.

x-scanner: &scanner
  build: .
  image: odds-scanner:latest
  env_file:
    - path: .env
      required: false
  environment:
    SCAN_SPORTS: ${SCAN_SPORTS:-soccer_epl}
    SCAN_MARKETS: ${SCAN_MARKETS:-h2h}
    SCAN_REGIONS: ${SCAN_REGIONS:-eu}
  volumes:
    - ./data:/app/data
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  scanner:
    <<: *scanner
    command: ["pipeline"]

  scheduler:
    <<: *scanner
    profiles: ["scheduler"]
    command: ["schedule"]
    environment:
      SCAN_SPORTS: ${SCAN_SPORTS:-soccer_epl}
      SCAN_MARKETS: ${SCAN_MARKETS:-h2h}
      SCAN_REGIONS: ${SCAN_REGIONS:-eu}
      SCHEDULE_TIMES: ${SCHEDULE_TIMES:-10:00,18:00}
    restart: unless-stopped
